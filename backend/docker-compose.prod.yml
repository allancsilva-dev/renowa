services:
  api:
    build: .
    container_name: renowa-api
    restart: unless-stopped
    ports:
      - "3002:3000"
    env_file:
      - .env
    environment:
      ZONADEV_EXPECTED_ISS: "https://auth.zonadev.tech"
      ZONADEV_JWKS_URL: "https://auth.zonadev.tech/api/.well-known/jwks.json"
      OIDC_CLIENT_ID: "renowa"
      OIDC_REDIRECT_URI: "https://renowa.zonadev.tech/callback"
      OIDC_LOGOUT_REDIRECT: "https://renowa.zonadev.tech"
      AUTH_COOKIE_NAME: "renowa_access_token"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - renowa-network

networks:
  renowa-network:
    driver: bridge
