# Deploy de produção — ver docs/DEPLOY_HOSTINGER.md.
#
# `RENOWA_VERSION` marca a imagem (use o SHA do commit). Sem tag não existe
# artefato conhecido-bom para voltar: rollback vira rebuild do source, minutos
# fora do ar. Com tag, rollback é trocar a variável e `up -d`.
# ATENÇÃO: rollback de imagem NÃO desfaz migration — o runner é forward-only.
# Mudança destrutiva de schema precisa ser compatível com a versão anterior.
x-logging: &logging
  # json-file sem limite cresce até encher o disco da VPS, e disco cheio
  # derruba o Postgres junto.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    container_name: Renowa-DB
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - renowa-db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - renowa

  redis:
    image: redis:7-alpine
    container_name: Renowa-Redis
    restart: unless-stopped
    logging: *logging
    mem_limit: 256m
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - renowa-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - renowa

  api:
    build:
      # Contexto na RAIZ: o backend depende do workspace privado
      # `@renowa/shared`, que não existe no registry npm. Com contexto
      # ./backend o `npm ci` falhava com 404 e a imagem nunca buildava.
      context: .
      dockerfile: backend/Dockerfile
    image: renowa-api:${RENOWA_VERSION:-latest}
    container_name: Renowa-API
    restart: unless-stopped
    logging: *logging
    # Sem teto, um pico na API leva o Postgres junto por OOM no mesmo host.
    mem_limit: 768m
    # PID 1 com reaping: garante que o SIGTERM chegue ao enableShutdownHooks.
    init: true
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      TRUST_PROXY: 172.30.0.2/32
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:3083:3000"
    healthcheck:
      # /health/ready toca o banco; /health responde mesmo com o banco fora.
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      renowa: {}
      api_gateway:
        ipv4_address: 172.30.0.3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: /api
    image: renowa-web:${RENOWA_VERSION:-latest}
    container_name: Renowa-Web
    restart: unless-stopped
    logging: *logging
    mem_limit: 128m
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3080:80"
    networks:
      proxy: {}
      api_gateway:
        ipv4_address: 172.30.0.2

  backup:
    image: postgres:16-alpine
    container_name: Renowa-Backup
    restart: unless-stopped
    logging: *logging
    mem_limit: 256m
    environment:
      PGHOST: db
      PGPORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./ops/postgres-backup.sh:/usr/local/bin/postgres-backup:ro
      - ./backups:/backups
    entrypoint: ["/usr/local/bin/postgres-backup"]
    networks:
      - renowa

volumes:
  renowa-db-data:
  renowa-redis-data:

networks:
  renowa:
    driver: bridge
  proxy:
    external: true
  api_gateway:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/28
