services:
  db:
    image: postgres:16-alpine
    container_name: Renowa-DB
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - renowa-db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - renowa

  redis:
    image: redis:7-alpine
    container_name: Renowa-Redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - renowa-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - renowa

  api:
    build:
      context: ./backend
    container_name: Renowa-API
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      TRUST_PROXY: 172.30.0.2/32
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      renowa: {}
      api_gateway:
        ipv4_address: 172.30.0.3

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    container_name: Renowa-Web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      proxy: {}
      api_gateway:
        ipv4_address: 172.30.0.2

  backup:
    image: postgres:16-alpine
    container_name: Renowa-Backup
    restart: unless-stopped
    environment:
      PGHOST: db
      PGPORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./ops/postgres-backup.sh:/usr/local/bin/postgres-backup:ro
      - ./backups:/backups
    entrypoint: ["/usr/local/bin/postgres-backup"]
    networks:
      - renowa

volumes:
  renowa-db-data:
  renowa-redis-data:

networks:
  renowa:
    driver: bridge
  proxy:
    external: true
  api_gateway:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/28
