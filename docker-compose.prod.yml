services:
  api:
    build:
      context: ./backend
    container_name: renowa-api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "127.0.0.1:3002:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - renowa

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    container_name: renowa-frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3080:80"
    networks:
      - renowa

networks:
  renowa:
    driver: bridge
