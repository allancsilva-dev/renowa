server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip — reduz tamanho dos assets transferidos
    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets com hash gerado pelo Vite podem ser cacheados por 1 ano com segurança
    # O hash muda a cada build, então nunca haverá conteúdo desatualizado em cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Rota principal — fallback para index.html essencial para o React Router funcionar
    # Sem isso, qualquer refresh em /pedidos, /clientes etc. retorna 404 do nginx
    location / {
        try_files $uri $uri/ /index.html;
    }
}
