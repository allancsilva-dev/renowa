map $http_x_forwarded_proto $forwarded_proto {
    default "";
    http http;
    https https;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    include /etc/nginx/security-headers.conf;

    location /api/ {
        if ($forwarded_proto = "") { return 400; }
        if ($http_x_real_ip = "") { return 400; }

        set $api_upstream Renowa-API:3000;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_real_ip;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Nomes com hash de conteúdo: build novo gera nome novo, cache eterno é seguro.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        # Um único Cache-Control. Com `expires 1y` junto do `add_header`, o nginx
        # emitia dois cabeçalhos Cache-Control na mesma resposta.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # `index.html` referencia os assets com hash, então ele NÃO pode ser cacheado
    # sem revalidar: browser com cópia velha continua servindo o bundle antigo
    # (que ainda está no cache imutável) e o deploy não aparece. `no-cache` não
    # proíbe guardar, obriga revalidar via ETag — o 304 é barato.
    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
