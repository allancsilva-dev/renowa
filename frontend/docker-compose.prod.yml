services:
  frontend:
    container_name: renowa-frontend
    build:
      context: .
      # Build args passados aqui sobrescrevem os defaults do Dockerfile
      # Não usar .env — essas variáveis são embutidas no bundle pelo Vite em build time
      args:
        VITE_API_URL: https://api.renowa.zonadev.tech/api
        VITE_AUTH_URL: https://auth.zonadev.tech
        VITE_EXPECTED_AUD: renowa.zonadev.tech
    ports:
      # 3080 na VPS → 80 no container; o NPM faz o proxy de renowa.zonadev.tech para 3080
      - "3080:80"
    restart: unless-stopped
