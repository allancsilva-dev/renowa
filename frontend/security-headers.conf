# Cabeçalhos de segurança da resposta.
#
# Precisa ser um include repetido em cada `location` que declara `add_header`:
# no nginx, `add_header` de um nível só é herdado se o nível atual NÃO tiver
# nenhum `add_header` próprio. Um único `add_header Cache-Control` dentro de um
# location derruba silenciosamente todos estes — inclusive a CSP.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
# A origem `blob:` nas fontes de imagem existe porque o preview de foto (produto
# e item de pedido) monta a imagem com `URL.createObjectURL(file)` antes de
# salvar. Sem ela a imagem só quebra em produção — `vite dev` não emite CSP.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' data: https://viacep.com.br; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
